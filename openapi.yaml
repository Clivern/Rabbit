    get:
      tags: [Chats]
      summary: Get a chat with its messages
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/chatId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Chats]
      summary: Delete a chat with its messages
      description: An answer still being written for the chat is dropped.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/chatId"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/chats/{chatId}/messages:
    post:
      tags: [Chats]
      summary: Ask in a chat and stream the answer
      description: |
        Stores the question, marks the chat `running` and streams the answer as server-sent events. Each event has a
        name and a JSON `data` line:

        - `chat`: the chat with the question stored and status `running`.
        - `delta`: `{"content": "..."}`, the next piece of the answer as it is written, in Markdown.
        - `done`: the chat with the answer stored and status `idle`.
        - `error`: the chat with status `failed` when the answer could not be written.

        The answer is written with the dashboard tools the user may run, under the user's own permissions. It is still
        stored when the client disconnects mid-stream, so a client can read the chat again to get it. Errors found before
        the question is stored come back as JSON with their status code instead of a stream.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/chatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageRequest"
      responses:
        "200":
          description: A stream of chat, delta, then done or error events
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: chat
                  data: {"id":"...","title":"Which agents do I have?","status":"running","messages":[...]}

                  event: delta
                  data: {"content":"You have **2 agents**"}

                  event: done
                  data: {"id":"...","title":"Which agents do I have?","status":"idle","messages":[...]}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The assistant is still answering the chat's last message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: _sloth_session
    userApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    workspaceAccessKey:
      type: apiKey
      in: header
      name: X-Access-Key
    metricsBasicAuth:
      type: http
      scheme: basic
    agentSource:
      type: apiKey
      in: header
      name: X-Source-Agent
      description: Name of the calling agent; sent with every agent credential.
    agentApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Secret of the calling agent's api_key identity.
    agentBasicAuth:
      type: http
      scheme: basic
      description: Username and secret of the calling agent's basic_auth identity.
    agentBearer:
      type: http
      scheme: bearer
      description: Token issued to the calling agent's client_credentials identity.

  parameters:
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    agentName:
      name: agentName
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
    instanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
    checkId:
      name: checkId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
    apiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    inviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    memberUserId:
      name: memberUserId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    intentionId:
      name: intentionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    integrationId:
      name: integrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    trafficId:
      name: trafficId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    chatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    kvKey:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: Key path segment(s) after `/kv/`
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Validation or bad input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit reached for this client IP; retry after the `Retry-After` header
      headers:
        Retry-After:
          description: Seconds until the window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Dependency or billing provider not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string

    CatalogSkill:
      type: object
      properties:
        id:
          type: string
          example: user.profile.get
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        inputModes:
          type: array
          items:
            type: string
          description: The skill's input modes, or the card's defaults.
        outputModes:
          type: array
          items:
            type: string
          description: The skill's output modes, or the card's defaults.
        agents:
          type: integer
          description: How many agents the caller may call for this skill.

    CatalogSkillInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
