        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Instances]
      summary: Register or update instance
      description: |
        Accepts workspace access keys (`X-Access-Key`) without a user session.
        The agent must be registered before its instances. While the agent has no card,
        registering an instance fetches it from the instance's address and port at the
        agent's `cardPath`, over https and then http, with a 5 second timeout per attempt.
        The body must be a JSON object of at most 1 MiB. A failed fetch does not fail the
        registration; the next instance to register tries again.
      security:
        - sessionCookie: []
        - userApiKey: []
        - workspaceAccessKey: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - $ref: "#/components/parameters/instanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInstanceRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Instances]
      summary: Deregister instance
      security:
        - sessionCookie: []
        - userApiKey: []
        - workspaceAccessKey: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

