  /api/v1/workspaces/{workspaceId}/agents/{agentName}/checks/{checkId}:
    put:
      tags: [Health checks]
      summary: Create or replace an agent health check template
      description: |
        The template is copied onto every registered instance of the agent, and onto each
        instance that registers later. `http` and `tcp` checks are probed by Sloth on their
        interval; `ttl` checks must be reported by the instance before the TTL runs out.
        An instance's status is the worst status across its checks.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - $ref: "#/components/parameters/checkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAgentCheckRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCheck"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Health checks]
      summary: Delete an agent health check template
      description: Also removes the check from every instance of the agent.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - $ref: "#/components/parameters/checkId"
      responses:
        "204":
          description: Deleted
        "401":
