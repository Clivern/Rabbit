          type: string
          format: uuid
        type:
          type: string
          enum: [webhook, slack, datadog, splunk, pagerduty]
        name:
          type: string
        url:
          type: string
        site:
          type: string
        index:
          type: string
        events:
          $ref: "#/components/schemas/IntegrationEvents"
        hasSecret:
          type: boolean
        isActive:
          type: boolean
        secret:
          type: string
          description: Generated webhook signing secret, only on create.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Event:
      type: object
      description: |
        Something that happened in the workspace. It is stored, then delivered to every active integration subscribed to its type.

        - `agent.instance.changed` fires when an instance registers, moves to a new endpoint (scheme, address, port or path) or deregisters. Registering again at the same endpoint fires nothing. Resource type `agent_instance`.
        - `agent.health.changed` fires when a check changes status, from a ttl report or an http or tcp probe. A first `passing` after `unknown` is not a change. A ttl check past its ttl counts as `critical` before the report. Resource type `health_check`.
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        type:
          type: string
          enum: [audit.log, agent.health.changed, agent.instance.changed, catalog.changed, gateway.call.denied, system.health.degraded]
        actorId:
          type: string
          format: uuid
          description: The user or access key behind the request. Absent for system events.
        actorName:
          type: string
          description: The user's name or the access key's name.
        actorType:
          type: string
          description: "`system` when no request caused the event, such as a probe result."
          enum: [user, access_key, system]
        resourceType:
          type: string
          enum: [agent_instance, health_check]
        resourceId:
          type: string
          format: uuid
        ipAddress:
          type: string
        userAgent:
          type: string
        data:
          type: object
          additionalProperties:
            type: string
          description: |
            Depends on the type.

            - `agent.instance.changed`: `action` (`registered`, `updated` or `deregistered`), `agentName`, `instanceId`, and on register or update `scheme`, `address`, `port` and `path`.
            - `agent.health.changed`: `agentName`, `instanceId`, `checkId`, `from`, `to` and `output`.
          example:
            action: registered
            agentName: users
            instanceId: users-9203
            scheme: http
            address: 127.0.0.1
            port: "9203"
            path: /a2a/v1
        createdAt:
          type: string
          format: date-time

