  /api/v1/workspaces/{workspaceId}/agents/{agentName}/instances/{instanceId}:
    get:
      tags: [Instances]
      summary: Get instance
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
        - $ref: "#/components/parameters/instanceId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
