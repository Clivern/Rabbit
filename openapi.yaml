    SaveIntegrationRequest:
      type: object
      required: [type, name, events, isActive]
      description: |
        webhook and slack need url; datadog needs site and secret (API key); splunk needs url and secret (HEC token); pagerduty needs site and secret (integration key).

        PagerDuty sends `info` events (`audit.log`, `agent.instance.changed`, `catalog.changed`) as change events, which show on the service timeline without opening an incident. `agent.health.changed` keeps one incident per check: it triggers on `warning`, `critical` or `unknown` with that severity, and resolves when the check is `passing` again. Other events trigger an incident each.
      properties:
        type:
          type: string
          enum: [webhook, slack, datadog, splunk, pagerduty]
        name:
          type: string
          maxLength: 60
        url:
          type: string
          format: uri
          maxLength: 2048
        site:
          type: string
          description: Datadog site, or the PagerDuty events host.
          enum: [datadoghq.com, us3.datadoghq.com, us5.datadoghq.com, datadoghq.eu, ap1.datadoghq.com, ddog-gov.com, events.pagerduty.com, events.eu.pagerduty.com]
        index:
          type: string
          maxLength: 100
        secret:
          type: string
          minLength: 8
          maxLength: 512
          writeOnly: true
        events:
          $ref: "#/components/schemas/IntegrationEvents"
        isActive:
          type: boolean

