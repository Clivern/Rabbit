        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/agents/{agentName}/protection:
    get:
      tags: [Protection]
      summary: Get the agent protection
      description: The credential Sloth uses to call the agent. Secrets are never returned.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProtection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Agent not found, or the agent has no protection
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Protection]
      summary: Set or replace the agent protection
      description: |
        An agent has at most one protection; saving replaces the previous credential and turns it on.
        `api_key` and `basic_auth` secrets are stored encrypted so the gateway can send them.
        When `secret` is omitted Sloth generates one and returns it in `secret` once.
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAgentProtectionRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProtection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Protection]
      summary: Remove the agent protection
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/agentName"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Agent not found, or the agent has no protection
        "500":
          $ref: "#/components/responses/InternalError"

