  /api/v1/workspaces/{workspaceId}/agents/catalog/skills:
    get:
      tags: [Catalog]
      summary: List the skills the calling agent may call
      description: |
        Lists the skills on agent cards in the workspace that the calling agent may call,
        grouped by skill id and sorted by id. A skill is callable when the best matching
        intention for the caller, the agent and the skill is `allow`; a rule for the exact
        skill beats a rule for the whole agent, and no rule means deny. The caller never
        appears in its own results. When cards disagree on a skill's name, description or
        tags, the agent whose name sorts first describes it. A caller with no `allow`
        intentions gets an empty list.

        Authenticates the calling agent by its identity, not a user or access key: send
        `X-Source-Agent` with `X-API-Key`, basic auth, or a client credentials bearer token.
      security:
        - agentSource: []
          agentApiKey: []
        - agentSource: []
          agentBasicAuth: []
        - agentSource: []
          agentBearer: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - name: tags
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated; keeps skills that have at least one of these tags.
        - name: passing
          in: query
          required: false
          schema:
            type: boolean
          description: When `true`, only count agents that have a live instance.
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogSkill"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Missing or wrong agent credential, or a disabled identity (`invalid_agent_identity`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspaces/{workspaceId}/agents/catalog/skills/{skill}/agents:
    get:
      tags: [Catalog]
      summary: List the agents the calling agent may call for a skill
      description: |
        Returns the skill, described by the first agent by name that offers it, and the
        agents the caller may call for it, sorted by name. The same intention rule as the
        skill list applies. `cardUrl` and `sendUrl` point at the Sloth gateway, never at an
        instance. When agents offer the skill but the caller may call none of them, the
        list is empty; when no agent offers it, the response is 404.

        Authenticates the calling agent by its identity, like the skill list.
      security:
        - agentSource: []
          agentApiKey: []
        - agentSource: []
          agentBasicAuth: []
        - agentSource: []
          agentBearer: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - name: skill
          in: path
          required: true
          schema:
            type: string
          description: Exact skill id on the card.
        - name: passing
          in: query
          required: false
          schema:
            type: boolean
          description: When `true`, only return agents that have a live instance.
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill:
                    $ref: "#/components/schemas/CatalogSkillInfo"
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogAgent"
                  _meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Missing or wrong agent credential, or a disabled identity (`invalid_agent_identity`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No agent card in the workspace offers the skill (`skill_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

