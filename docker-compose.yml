name: sloth

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sloth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sloth"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    restart: unless-stopped

  migrate:
    image: ${SLOTH_IMAGE:-registry.digitalocean.com/sloth/sloth:main}
    restart: "no"
    command: ["migrate", "up", "-c", "/app/configs/config.yml"]
    environment:
      SLOTH_SERVER_URL: ${SLOTH_SERVER_URL:-http://localhost}
      SLOTH_DATABASE_HOST: postgres
      SLOTH_DATABASE_PORT: "5432"
      SLOTH_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      SLOTH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SLOTH_DATABASE_NAME: ${POSTGRES_DB:-sloth}
    volumes:
      - ./etc/config/config.yml:/app/configs/config.yml:ro
      - sloth_data:/app/var
    depends_on:
      postgres:
        condition: service_healthy

  sloth:
    image: ${SLOTH_IMAGE:-registry.digitalocean.com/sloth/sloth:main}
    restart: unless-stopped
    command: ["server", "-c", "/app/configs/config.yml"]
    environment:
      SLOTH_SERVER_URL: ${SLOTH_SERVER_URL:-http://localhost}
      SLOTH_DATABASE_HOST: postgres
      SLOTH_DATABASE_PORT: "5432"
      SLOTH_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      SLOTH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SLOTH_DATABASE_NAME: ${POSTGRES_DB:-sloth}
      SLOTH_BROKER_URL: nats://nats:4222
      SLOTH_LLM_PROVIDER: ${SLOTH_LLM_PROVIDER:-openrouter}
      SLOTH_LLM_API_KEY: ${SLOTH_LLM_API_KEY:-}
      SLOTH_LLM_CHAT_MODEL: ${SLOTH_LLM_CHAT_MODEL:-openai/gpt-4o}
      SLOTH_RESEND_API_KEY: ${SLOTH_RESEND_API_KEY:-}
      SLOTH_STRIPE_SECRET_KEY: ${SLOTH_STRIPE_SECRET_KEY:-}
      SLOTH_STRIPE_WEBHOOK_SECRET: ${SLOTH_STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./etc/config/config.yml:/app/configs/config.yml:ro
      - sloth_data:/app/var
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sloth

volumes:
  postgres_data:
  sloth_data:
