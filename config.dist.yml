app:
  name: ${SLOTH_SERVER_NAME:-Sloth}
  mode: ${SLOTH_SERVER_MODE:-prod}
  port: ${SLOTH_SERVER_PORT:-8000}
  url: ${SLOTH_SERVER_URL:-http://127.0.0.1:8000}
  timeout: ${SLOTH_SERVER_TIMEOUT:-50}
  # Comma-separated CIDRs of reverse proxies allowed to set X-Forwarded-For; empty means use the TCP peer
  trusted_proxies: ${SLOTH_TRUSTED_PROXIES:-}

  encryption:
    key: ${SLOTH_ENCRYPTION_KEY:-}

  metrics:
    username: ${SLOTH_SERVER_PROM_METRICS_USERNAME:-admin}
    secret: ${SLOTH_SERVER_PROM_METRICS_SECRET:-secret}

  log:
    level: ${SLOTH_SERVER_LOG_LEVEL:-debug}
    output: ${SLOTH_SERVER_LOG_OUTPUT:-stdout}
    format: ${SLOTH_SERVER_LOG_FORMAT:-json}

  mailer:
    provider: ${SLOTH_MAILER_PROVIDER:-resend}
    from: ${SLOTH_MAILER_FROM:-no_reply@clivern.com}
    resend:
      api_key: ${SLOTH_RESEND_API_KEY:-}

  oauth:
    github:
      client_id: ${SLOTH_GITHUB_OAUTH_CLIENT_ID:-}
      client_secret: ${SLOTH_GITHUB_OAUTH_CLIENT_SECRET:-}
      redirect_url: ${SLOTH_GITHUB_OAUTH_REDIRECT_URL:-}
    google:
      client_id: ${SLOTH_GOOGLE_OAUTH_CLIENT_ID:-}
      client_secret: ${SLOTH_GOOGLE_OAUTH_CLIENT_SECRET:-}
      redirect_url: ${SLOTH_GOOGLE_OAUTH_REDIRECT_URL:-}

  database:
    rw:
      driver: ${SLOTH_DATABASE_DRIVER:-postgres}
      host: ${SLOTH_DATABASE_HOST:-localhost}
      port: ${SLOTH_DATABASE_PORT:-5433}
      username: ${SLOTH_DATABASE_USERNAME:-postgres}
      password: ${SLOTH_DATABASE_PASSWORD:-postgres}
      name: ${SLOTH_DATABASE_NAME:-sloth}
      max_open_conns: ${SLOTH_DATABASE_MAX_OPEN_CONNS:-25}
      max_idle_conns: ${SLOTH_DATABASE_MAX_IDLE_CONNS:-10}
      conn_max_lifetime: ${SLOTH_DATABASE_CONN_MAX_LIFETIME:-300}
    ro:
    - driver: ${SLOTH_DATABASE_DRIVER:-postgres}
      host: ${SLOTH_DATABASE_HOST:-localhost}
      port: ${SLOTH_DATABASE_PORT:-5433}
      username: ${SLOTH_DATABASE_USERNAME:-postgres}
      password: ${SLOTH_DATABASE_PASSWORD:-postgres}
      name: ${SLOTH_DATABASE_NAME:-sloth}
      max_open_conns: ${SLOTH_DATABASE_MAX_OPEN_CONNS:-25}
      max_idle_conns: ${SLOTH_DATABASE_MAX_IDLE_CONNS:-10}
      conn_max_lifetime: ${SLOTH_DATABASE_CONN_MAX_LIFETIME:-300}

  billing:
    provider: ${SLOTH_BILLING_PROVIDER:-stripe}
    secret_key: ${SLOTH_STRIPE_SECRET_KEY:-}
    webhook_secret: ${SLOTH_STRIPE_WEBHOOK_SECRET:-}
    tokens_per_usd: ${SLOTH_TOKENS_PER_USD:-20000}
    urls:
      checkout_success: ${SLOTH_STRIPE_CHECKOUT_SUCCESS_URL:-/billing/success}
      checkout_cancel: ${SLOTH_STRIPE_CHECKOUT_CANCEL_URL:-/billing/cancel}
      portal_return: ${SLOTH_STRIPE_PORTAL_RETURN_URL:-/billing}

  llm:
    # openrouter or muse
    provider: ${SLOTH_LLM_PROVIDER:-openrouter}
    api_key: ${SLOTH_LLM_API_KEY:-}
    chat_model: ${SLOTH_LLM_CHAT_MODEL:-openai/gpt-4o}
    # muse only: minimal, low, medium, high, xhigh or max; higher thinks longer before answering
    reasoning_effort: ${SLOTH_LLM_REASONING_EFFORT:-minimal}
  cache:
    provider: ${SLOTH_CACHE_PROVIDER:-redis}
    redis:
      addr: ${SLOTH_REDIS_ADDR:-127.0.0.1:6379}
      password: ${SLOTH_REDIS_PASSWORD:-}
      db: ${SLOTH_REDIS_DB:-0}
      pool_size: ${SLOTH_REDIS_POOL_SIZE:-10}
      min_idle_conns: ${SLOTH_REDIS_MIN_IDLE_CONNS:-5}

  broker:
    provider: ${SLOTH_BROKER_PROVIDER:-nats}
    nats:
      url: ${SLOTH_BROKER_URL:-nats://127.0.0.1:4222}
      name: ${SLOTH_BROKER_NAME:-sloth}
      queue: ${SLOTH_BROKER_QUEUE:-sloth}
